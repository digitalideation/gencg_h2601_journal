name: Deploy Quartz POC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout the Obsidian vault
      - name: Checkout vault
        uses: actions/checkout@v6
        with:
          path: vault

      # Checkout Quartz v5
      - name: Checkout Quartz v5
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Copy the complete vault into Quartz content
      #
      # Markdown will be processed by Quartz.
      # HTML, JS, CSS and other assets are emitted as content assets.
      - name: Copy vault into Quartz
        run: |
          rm -rf quartz/content/*
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='.trash/' \
            vault/ quartz/content/

      # # Convert Obsidian HTML embeds into web iframes
      # #
      # # ![[sketches/01-test/index.html]]
      # #
      # # becomes:
      # #
      # # <iframe src="./sketches/01-test/index.html"></iframe>
      # #
      # # Optional dimensions:
      # #
      # # ![[sketches/01-test/index.html|800x500]]
      # - name: Convert Obsidian HTML embeds
      #   run: |
      #     python3 <<'PY'
