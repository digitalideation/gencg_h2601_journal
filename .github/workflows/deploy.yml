      #     )

      #     markdown_pattern = re.compile(
      #         r'!\[\]\(<?([^)>]+\.html)>?\)'
      #     )


      #     def iframe(src, width="100%", height="600"):
      #         return (
      #             f'<iframe src="{src}" '
      #             f'width="{width}" '
      #             f'height="{height}" '
      #             f'loading="lazy" '
      #             f'sandbox="allow-scripts"></iframe>'
      #         )


      #     def convert_wiki(match):
      #         src = match.group(1)

      #         width = match.group(2) or "100%"
      #         height = match.group(3) or "600"

      #         if not src.startswith((".", "/")):
