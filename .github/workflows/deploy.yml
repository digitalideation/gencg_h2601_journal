      #     import re

      #     pattern = re.compile(
      #         r'!\[\[([^\]|]+\.html)(?:\|(\d+)x(\d+))?\]\]'
      #     )

      #     def convert(match):
      #         src = match.group(1)
      #         width = match.group(2) or "100%"
      #         height = match.group(3) or "600"

      #         if not src.startswith((".", "/")):
      #             src = "./" + src

      #         return (
      #             f'<iframe src="{src}" '
      #             f'width="{width}" '
      #             f'height="{height}" '
      #             f'loading="lazy" '
      #             f'sandbox="allow-scripts"></iframe>'
      #         )

      #     for file in Path("quartz/content").rglob("*.md"):
      #         text = file.read_text(encoding="utf-8")
      #         updated = pattern.sub(convert, text)

      #         if updated != text:
      #             print(f"Converted embeds in {file}")
      #             file.write_text(updated, encoding="utf-8")
      #     PY

      # Configure Quartz
      - name: Configure Quartz
        run: |
          cp vault/quartz.config.yaml quartz/quartz.config.yaml

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          if [ "$REPO" = "$OWNER.github.io" ]; then
            BASE_URL="$OWNER.github.io"
          else
            BASE_URL="$OWNER.github.io/$REPO"
          fi

          sed -i "s|__BASE_URL__|$BASE_URL|" quartz/quartz.config.yaml
          
      # Install Quartz
      - name: Install Quartz
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install --clean
          npx quartz plugin install --from-config

      # Build the site
      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build

      # Prepare GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

      # Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4