name: Deploy Quartz

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false


jobs:

  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # 1. CHECKOUT STUDENT VAULT
      # --------------------------------------------------------

      - name: Checkout vault
        uses: actions/checkout@v6
        with:
          path: vault
          fetch-depth: 0


      # --------------------------------------------------------
      # 2. CHECKOUT QUARTZ
      # --------------------------------------------------------

      - name: Checkout Quartz v5
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz


      # --------------------------------------------------------
      # 3. NODE
      # --------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false


      # --------------------------------------------------------
      # 4. COPY VAULT CONTENT
      #
      # Quartz processes Markdown and normal assets.
      #
      # Standalone creative-code sketch folders bypass Quartz
      # because their filenames and directory structure must
      # remain untouched.
      # --------------------------------------------------------

      - name: Copy vault into Quartz
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='.trash/' \
            --exclude='quartz.config.yaml' \
            --exclude='quartz-plugins/' \
            --exclude='weeks/*/sketches/' \
            vault/ quartz/content/


      # --------------------------------------------------------
      # 5. QUARTZ CONFIG
      #
      # The repository owns quartz.config.yaml.
      #
      # GitHub Pages project URLs are derived automatically from:
      #
      # owner/repository
      #
      # Example:
      #
      # alice/my-journal
      #
      # ->
      #
      # alice.github.io/my-journal
      # --------------------------------------------------------

      - name: Configure Quartz
        run: |
          cp vault/quartz.config.yaml quartz/quartz.config.yaml

          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"

          if [ "$REPO" = "$OWNER.github.io" ]; then
            BASE_URL="$OWNER.github.io"
          else
            BASE_URL="$OWNER.github.io/$REPO"
          fi

          sed -i \
            "s|__BASE_URL__|$BASE_URL|" \
            quartz/quartz.config.yaml

          echo "Quartz base URL: $BASE_URL"


      # --------------------------------------------------------
