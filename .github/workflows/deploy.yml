name: Deploy Quartz POC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout the Obsidian vault
      - name: Checkout vault
        uses: actions/checkout@v6
        with:
          path: vault

      # 2. Checkout Quartz v5 separately
      - name: Checkout Quartz v5
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      # Quartz v5 requires Node >= 22
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # 3. Replace Quartz example content with vault content
      #
      # Keep weeks/wXX/index.md as normal Quartz content,
      # but don't send standalone sketch files through Quartz.
      - name: Copy vault into Quartz
        run: |
          rm -rf quartz/content/*
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='.trash/' \
            --exclude='weeks/*/sketches/' \
            vault/ quartz/content/

      # 4. Copy standalone sketches as static files
      #
      # Example:
      # vault/weeks/w01/sketches/01-test/index.html
      #
      # becomes:
      # /weeks/w01/sketches/01-test/index.html
      #
      # This makes relative iframe URLs such as
      # ./sketches/01-test/index.html work from /weeks/w01/.
      - name: Copy standalone sketches as static files
        run: |
          mkdir -p quartz/static/weeks

          rsync -av vault/weeks/ quartz/static/weeks/ \
            --include='*/' \
            --include='*.html' \
            --include='*.js' \
            --include='*.css' \
            --exclude='*'

      # 5. Install Quartz dependencies and default plugins
      - name: Install Quartz
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install --clean

      # 6. Build the static site
      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build

      # 7. Prepare GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

      # 8. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4