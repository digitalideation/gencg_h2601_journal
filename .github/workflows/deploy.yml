      #         text = file.read_text(encoding="utf-8")

      #         updated = wiki_pattern.sub(
      #             convert_wiki,
      #             text,
      #         )

      #         updated = markdown_pattern.sub(
      #             convert_markdown,
      #             updated,
      #         )

      #         if updated != text:

      #             print(
      #                 f"Converted HTML embeds in {file}"
      #             )

      #             file.write_text(
      #                 updated,
      #                 encoding="utf-8",
      #             )
      #     PY

      # --------------------------------------------------------
      # 7. COPY LOCAL QUARTZ PLUGINS
      # --------------------------------------------------------
      - name: Copy local Quartz plugins
        run: |
          rm -rf quartz/quartz-plugins
          cp -R vault/quartz-plugins quartz/quartz-plugins

      # --------------------------------------------------------
      # 8. INSTALL QUARTZ + CONFIGURED PLUGINS
      #
      # --from-config installs things such as the Excalidraw
      # Quartz plugin declared in quartz.config.yaml.
      # --------------------------------------------------------

      - name: Install Quartz
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install --clean
          npx quartz plugin install --from-config


      # --------------------------------------------------------
      # 9. BUILD
      # --------------------------------------------------------

      - name: Build Quartz
        working-directory: quartz
        run: |
          npx quartz build


      # --------------------------------------------------------
      # 10. COPY STANDALONE SKETCHES
      #
      # These bypass Quartz so that:
      #
      # index.html
      # sketch.js
      # style.css
      # shaders
      # json
      # wasm
      # images
      # etc.
      #
      # remain unchanged.
      # --------------------------------------------------------

      - name: Copy standalone sketches
        run: |
          if [ -d vault/weeks ]; then

            find vault/weeks \
              -type d \
              -name sketches \
              -print0 | \

            while IFS= read -r -d '' dir; do

              rel="${dir#vault/}"

              mkdir -p \
                "quartz/public/$rel"

              rsync -av \
                "$dir/" \
                "quartz/public/$rel/"

            done

          fi


      # --------------------------------------------------------
      # 11. GITHUB PAGES
      # --------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public


      # --------------------------------------------------------
      # 12. DEPLOY
      # --------------------------------------------------------

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5