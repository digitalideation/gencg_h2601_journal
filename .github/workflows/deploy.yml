      #
      # Obsidian:
      #
      # ![[./sketches/01-test/index.html]]
      #
      # becomes:
      #
      # <iframe src="./sketches/01-test/index.html"></iframe>
      #
      # Optional size:
      #
      # ![[./sketches/01-test/index.html|800x500]]
      #
      # Also accepts:
      #
      # ![](./sketches/01-test/index.html)
      # --------------------------------------------------------

