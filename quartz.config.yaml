configuration:
  pageTitle: Generative Computer Graphics Journal
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true

  analytics:
    provider: plausible

  locale: en-US

  # Replaced automatically during GitHub Actions deployment.
  baseUrl: __BASE_URL__

  ignorePatterns:
    - private
    - templates
    - .obsidian
    - README.md

  theme:
    fontOrigin: googleFonts
    cdnCaching: true

    typography:
      title: Newsreader
      header: Newsreader
      body: Inter
      code: IBM Plex Mono

    colors:
      lightMode:
        light: "#f7f5ef"
        lightgray: "#e7e2d8"
        gray: "#9b978f"
        darkgray: "#3b3935"
        dark: "#181714"
        secondary: "#9a3d28"
        tertiary: "#536b59"
        highlight: rgba(154, 61, 40, 0.09)
        textHighlight: "#e9c46a66"

      darkMode:
        light: "#1b1a17"
        lightgray: "#34312b"
        gray: "#777169"
        darkgray: "#d2cec5"
        dark: "#f3efe6"
        secondary: "#df8068"
        tertiary: "#9ab5a0"
        highlight: rgba(223, 128, 104, 0.12)
        textHighlight: "#d6ad4966"


plugins:

  # ------------------------------------------------------------
  # TRANSFORMERS
  # ------------------------------------------------------------

  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40

  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      condition: not-index

  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: "./quartz-plugins/html-embed"
    enabled: true
    order: 65

  - source: "@quartz-community/description"
    enabled: true
    order: 70

  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: "@quartz-community/citations"
    enabled: false
    order: 85

  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90

  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91

  - source: "@quartz-community/roam"
    enabled: false
    order: 92

  - source: "@quartz-community/quartz-fonts"
    enabled: true

  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both


  # ------------------------------------------------------------
  # FILTERS
  # ------------------------------------------------------------

  - source: "@quartz-community/remove-draft"
    enabled: true

  # We can enable this later if we want ONLY notes containing
  # `publish: true` to appear on the public site.
  - source: "@quartz-community/explicit-publish"
    enabled: false


  # ------------------------------------------------------------
  # EMITTERS / PAGE TYPES
  # ------------------------------------------------------------

  - source: "@quartz-community/alias-redirects"
    enabled: true

  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: "@quartz-community/favicon"
    enabled: true

  - source: "@quartz-community/og-image"
    enabled: true

  - source: "@quartz-community/cname"
    enabled: true

  - source: "@quartz-community/canvas-page"
    enabled: true

  # Obsidian Excalidraw support
  - source: "github:quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20

  - source: "@quartz-community/content-page"
    enabled: true

  - source: "@quartz-community/folder-page"
    enabled: true

  - source: "@quartz-community/tag-page"
    enabled: true


  # ------------------------------------------------------------
  # COMPONENTS
  # ------------------------------------------------------------

  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50

  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10

  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true

  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: afterBody
      priority: 30
      condition: not-index

  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10

  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20

  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30

  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10

  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10

  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Quartz: https://quartz.jzhao.xyz/
    layout:
      position: footer
      priority: 50

  - source: "@quartz-community/recent-notes"
    enabled: false

  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50

  - source: "@quartz-community/note-properties"
    enabled: false
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45

  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900

  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all


# ------------------------------------------------------------
# LAYOUT
# ------------------------------------------------------------

layout:

  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem

  byPageType:

    "404":
      positions:
        beforeBody: []
        left: []
        right: []

    content: {}

    folder:
      exclude:
        - reader-mode
      positions:
        right: []

    tag:
      exclude:
        - reader-mode
      positions:
        right: []

    canvas: {}

    bases: {}